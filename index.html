});
$('undo').onclick=()=>{if(closed)closed=false;else pts.pop();redraw();upd()};
$('clear').onclick=()=>{pts=[];closed=false;redraw();upd()};

function judge(){
  const t=TOWNS[key],all=t.flat().concat(pts),k=Math.cos(all[0][0]*Math.PI/180),P=p=>[p[1]*k,-p[0]],xy=all.map(P),N=500;
  const minx=Math.min(...xy.map(p=>p[0])),miny=Math.min(...xy.map(p=>p[1]));
  const s=Math.max(Math.max(...xy.map(p=>p[0]))-minx,Math.max(...xy.map(p=>p[1]))-miny)*1.02;
  const f=p=>{const q=P(p);return[(q[0]-minx)/s*N,(q[1]-miny)/s*N]};
  const mk=rings=>{const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');x.beginPath();
    for(const r of rings){r.forEach((p,i)=>{const q=f(p);i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])});x.closePath()}x.fill('evenodd');return x.getImageData(0,0,N,N).data};
  const A=mk(t),B=mk([pts]);let i1=0,u=0,ta=0,tb=0;
  for(let i=3;i<A.length;i+=4){const a=A[i]>127,b=B[i]>127;if(a&&b)i1++;if(a||b)u++;if(a)ta++;if(b)tb++}
  return{iou:u?i1/u:0,cover:ta?i1/ta:0,extra:tb?(tb-i1)/tb:0};
}
const TITLES=[[90,['桜島級の土地勘','自治会長','境界の覇王']],[75,['天文館の主','回覧板マスター','領地奉行']],[55,['地元のおじさん','ゴミ当番ベテラン','城代家老']],[35,['市電ユーザー','引っ越してきたばかり','足軽大将']],[10,['観光客','表札を見て回る人','足軽']],[0,['県外から来た人','迷子の配達員','迷い武者']]];
const titleOf=s=>{const t=TITLES.find(x=>s>=x[0])[1];return t[Math.random()*t.length|0]};
const rankOf=s=>TITLES.find(x=>s>=x[0])[1][0];
const colorOf=s=>s>=90?'#c9a227':s>=75?'#d8321f':s>=55?'#e8752a':s>=35?'#2f6bff':'#6b7477';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el,to){if(reduce){el.textContent=to;return}const t0=performance.now(),d=900;const f=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
$('ok').onclick=()=>{if(revealed){qi++;return qi<qs.length?newRound():finish()}submit(false)};
function showNeighbors(k){
  const [x,y,sz]=ALL[k],R=Math.max(sz*1.4,.012),cos=Math.cos(y*Math.PI/180);
  const near=Object.keys(ALL).filter(n=>n!==k&&Math.hypot((ALL[n][0]-x)*cos,ALL[n][1]-y)<R+ALL[n][2]*.5).slice(0,14);
  Promise.all(near.map(n=>loadTown(n).then(r=>[n,r]).catch(()=>null))).then(list=>{
    if(key!==k||!revealed)return;const f=[];
    for(const it of list){if(!it)continue;const [n,rings]=it;for(const r of rings)f.push({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:ringLL(r)}});
      let best=null,bd=1e9;for(const r of rings)for(const p of r){const d=Math.hypot((p[1]-x)*cos,p[0]-y);if(d<bd){bd=d;best=p}}
      const t=Math.min(.35,(sz*.35)/(Math.hypot((ALL[n][0]-best[1])*cos,ALL[n][1]-best[0])||1)),lng=best[1]+(ALL[n][0]-best[1])*t,lat=best[0]+(ALL[n][1]-best[0])*t;
      const el=document.createElement('div');el.className='nbtag';el.textContent=n;nbTags.push(new maplibregl.Marker({element:el}).setLngLat([lng,lat]).addTo(map))}
    map.getSource('nb').setData(fc(f));map.setPaintProperty('nb-l','line-opacity',.7)});
}
function submit(timeout){
  clearInterval(timerId);
  const r=pts.length>=3?judge():{iou:0,cover:0,extra:0},s=Math.round(r.iou*100);results.push({name:key,s});revealed=true;closed=true;redraw();
  map.getSource('ans').setData(fc(TOWNS[key].map(r=>({type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[ringLL(r)]}}))));
  if(!reduce){let k=0;const a=()=>{k=Math.min(1,k+.04);map.setPaintProperty('ans-f','fill-opacity',.22*k);map.setPaintProperty('ans-l','line-width',1+4*k);if(k<1)requestAnimationFrame(a)};map.setPaintProperty('ans-f','fill-opacity',0);setTimeout(a,700)}
  setTimeout(()=>showNeighbors(key),reduce?0:1500);
  const b=bounds(TOWNS[key]),el=document.createElement('div');el.innerHTML='<div class="stamp"><span>'+esc(key)+'</span></div>';
  tag=new maplibregl.Marker({element:el}).setLngLat(b.getCenter()).addTo(map);
  for(const p of pts)b.extend([p[1],p[0]]);map.fitBounds(b,{padding:{top:60,bottom:200,left:40,right:40},duration:reduce?0:1300,curve:1.6});
  const ttl=titleOf(s);results[results.length-1].t=ttl;
  $('msg').textContent=`町の${Math.round(r.cover*100)}%を囲めた／線の${Math.round(r.extra*100)}%は町の外`;
  const pop=$('pop');pop.style.setProperty('--c',colorOf(s));pop.innerHTML=`${timeout?'<div class="to">時間切れ！</div>':''}<div class="sc"><span id="scN">0</span><small>点</small></div><div class="ttl">称号「${esc(ttl)}」</div>`;
  pop.hidden=true;setTimeout(()=>{pop.hidden=false;pop.classList.remove('go');void pop.offsetWidth;pop.classList.add('go');countUp($('scN'),s);setTimeout(()=>{pop.querySelector('.ttl').classList.add('in')},reduce?0:950)},reduce?0:1100);
  for(const id of ['undo','clear'])$(id).hidden=true;$('ok').textContent=qi+1<qs.length?'次へ':'結果を見る';upd();
}
function showRanking(n,me,myTot){
  $('ov').hidden=false;
  const tabs=[5,10,20].map(k=>`<button class="tab${k===n?' on':''}" data-n="${k}">${k}問</button>`).join('');
  $('card').innerHTML=`<h1>ランキング</h1><div class="row">${tabs}</div><div id="rk">${SB_URL?'読み込み中…':'ランキングはまだ準備中です'}</div><button id="back" style="width:100%;margin-top:10px">戻る</button>`;
  $('back').onclick=startScreen;for(const b of document.querySelectorAll('.tab'))b.onclick=()=>showRanking(+b.dataset.n);
  if(!SB_URL)return;
  sb(`scores?select=name,total,created_at&n=eq.${n}&order=total.desc,created_at.asc&limit=30`).then(rows=>{
    $('rk').innerHTML=rows.length?`<table>${rows.map((r,i)=>`<tr${me&&r.name===me&&r.total===myTot?' class="me"':''}><td>${i+1}位</td><td>${esc(r.name)}</td><td class="n">${r.total}点</td></tr>`).join('')}</table>`:'<p>まだ誰も登録していません。1番乗りのチャンス！</p>'})
  .catch(()=>{$('rk').textContent='ランキングを読み込めませんでした'});
}
function finish(){$('pop').hidden=true;
  const tot=results.reduce((a,b)=>a+b.s,0),avg=Math.round(tot/results.length),nb=avg>best;if(nb){best=avg;try{localStorage.setItem('kgsMapAvg',avg)}catch(e){}}
  $('ov').hidden=false;
  $('card').innerHTML=`<h1>結果</h1><div class="big">${tot}点</div><p class="bigttl">総合称号「${esc(titleOf(avg))}」</p><p>（${results.length*100}点満点）　平均${avg}点${nb?'　自己ベスト更新！':''}</p>
  <table>${results.map(r=>`<tr><td>${esc(r.name)}</td><td class="n">${r.s}点</td><td class="tt">${esc(r.t||'')}</td></tr>`).join('')}</table>
  ${challenge&&mode==='chal'&&challenge.score!=null?`<p class="vs">${tot>challenge.score?'勝ち！':tot<challenge.score?'負け…':'引き分け'}　あなた ${tot}点 vs ${challenge.name?esc(challenge.name):'相手'} ${challenge.score}点</p>`:''}
  <div class="opt"><label for="nm">ニックネーム（勝負・ランキング用）</label><input id="nm" maxlength="20" value="${esc(myName)}" placeholder="例：武岡の主"></div>
  <button class="go" id="share" style="width:100%">この問題で勝負する（URLを作る）</button>
  <div id="shareBox" hidden><input id="shareUrl" readonly><div class="row"><button id="copy">コピー</button><a id="line" class="btn" target="_blank" rel="noopener">LINEで送る</a></div></div>
  ${SB_URL&&/^res(5|10|20)$/.test(mode)?'<button id="reg" style="width:100%;margin-top:8px">ランキングに登録</button>':''}
  <p id="regMsg" class="note"></p>
  <button id="again" style="width:100%;margin-top:8px">もう一度</button>`;
  $('again').onclick=()=>{challenge=null;history.replaceState(null,'',location.pathname);startScreen()};
  const nm=()=>{myName=$('nm').value.trim().slice(0,20);try{localStorage.setItem('kgsName',myName)}catch(e){}return myName};
  $('share').onclick=()=>{const u=new URL(location.pathname,location.origin);u.searchParams.set('q',qs.map(t=>RES.indexOf(t)).join('.'));u.searchParams.set('s',tot);if(nm())u.searchParams.set('n',myName);
    $('shareUrl').value=u.toString();$('line').href='https://line.me/R/msg/text/?'+encodeURIComponent(`Danchi Guessor（団地の境界線当てゲーム）で${tot}点だった。同じ問題で勝負！ `+u);$('shareBox').hidden=false};
  $('copy').onclick=()=>{navigator.clipboard.writeText($('shareUrl').value).then(()=>$('copy').textContent='コピーしました',()=>{$('shareUrl').select()})};
  if($('reg'))$('reg').onclick=()=>{if(!nm()){$('regMsg').textContent='ニックネームを入れてください';return}
    $('reg').disabled=true;sb('scores',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({name:myName,total:tot,n:results.length})})
      .then(()=>showRanking(results.length,myName,tot)).catch(()=>{$('regMsg').textContent='登録できませんでした';$('reg').disabled=false})};
}
setTimeout(()=>{if($('card').textContent.includes('読み込み中'))$('card').innerHTML='<h1>地図を読み込めませんでした</h1><p>インターネットにつながっているか確認して、ページを開き直してください。</p>'},20000);
}
</script>
