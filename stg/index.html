  <button id="again" style="width:100%;margin-top:8px">もう一度</button>`;
  $('again').onclick=()=>{challenge=null;history.replaceState(null,'',location.pathname);startScreen()};
  const nm=()=>myName;$('rankBtn2').onclick=()=>showRanking(cat,/^rank/.test(mode)?results.length:5,myName,tot);
  $('share').onclick=()=>{const u=new URL(location.pathname,location.origin),K=DATA[region].keys;u.searchParams.set('c',cat);u.searchParams.set('q',qs.map(t=>K.indexOf(t)).join('.'));u.searchParams.set('s',tot);if(nm())u.searchParams.set('n',myName);
    $('shareUrl').value=u.toString();$('line').href='https://line.me/R/msg/text/?'+encodeURIComponent(`Danchi Guessor（${catOf(cat)[2]}）で${tot}点だった。同じ問題で勝負！ `+u);$('shareBox').hidden=false};
  $('copy').onclick=()=>{navigator.clipboard.writeText($('shareUrl').value).then(()=>$('copy').textContent='コピーしました',()=>{$('shareUrl').select()})};
  if(/^rank(5|10|20)$/.test(mode)&&myName){$('regMsg').textContent='ランキングに登録中…';
    sb('rpc/submit_score',{method:'POST',body:JSON.stringify({p_name:myName,p_token:TOKEN,p_cat:cat,p_n:results.length,p_total:tot,p_stg:STG})})
      .then(r=>{if(r.status!=='ok'){$('regMsg').textContent='この名前は他の人が使っているため、ランキングに登録できませんでした';return}
        $('regMsg').innerHTML=`<b>${esc(myName)}</b> ${r.best>tot?`の自己ベストは <b>${r.best}点</b> のまま`:'として登録しました'}。現在 <b>${r.rank}位</b>`})
      .catch(()=>{$('regMsg').textContent='ランキングに登録できませんでした'})}
}
setTimeout(()=>{if($('card').textContent.includes('読み込み中'))$('card').innerHTML='<h1>地図を読み込めませんでした</h1><p>インターネットにつながっているか確認して、ページを開き直してください。</p>'},20000);
}
</script>
</body></html>
